<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; gap: 10px; padding: 14px; box-sizing: border-box;
         background: #15151f; color: #e8e8f2; font: 14px "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 15px; margin: 0; }
  #etat { font-size: 12px; color: #8c8ca6; }
  textarea { flex: 1; resize: none; background: #0f0f17; color: inherit; border: 1px solid #2a2a3a; border-radius: 10px;
             padding: 10px 12px; font: inherit; line-height: 1.5; outline: none; }
  textarea:focus { border-color: #ffbe3c; }
</style>
</head>
<body>
  <header><h1>Bloc-notes express</h1><span id="etat"></span></header>
  <textarea id="notes" placeholder="Écris ici… (enregistré automatiquement)" autofocus></textarea>
  <script src="popup.js"></script>
</body>
</html>
